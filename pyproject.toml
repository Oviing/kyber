[project]
name = "kyber"
version = "0.1.0"
description = "Agent red-team sandbox platform (MVP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "redis>=5.0",
  "rq>=1.16",
  "docker>=7.0",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
llm = ["litellm>=1.40", "langgraph>=0.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
kyber = "kyber.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kyber*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112", "S101", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
