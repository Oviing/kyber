[project]
name = "kyber"
version = "0.2.0"
description = "Safe sandbox for terminal AI agents (bring-your-own CLI, isolated from host)"
readme = "README.md"
authors = [{name = "Oviing", email = "joel.kischkel@icloud.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
  "docker>=7.0",
  "typer>=0.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
kyber = "kyber.cli:main"

[project.urls]
Homepage = "https://github.com/Oviing/kyber"
Repository = "https://github.com/Oviing/kyber.git"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kyber*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# UP045 (X | None) is intentionally disabled: the package supports Python 3.9,
# where PEP 604 unions fail at runtime (pydantic/typer eval them).
ignore = ["BLE001", "S110", "S112", "S101", "B008", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
